<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interview Analysis — Facial Recognition Interview System</title>

  <!-- Load Chart.js FIRST -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Global Theme */
    body {
      background: linear-gradient(to bottom, #010a13, #000);
      color: #dfefff;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .interview-card {
      background: rgba(0, 10, 20, 0.85);
      border: 1px solid rgba(0, 191, 255, 0.2);
      border-radius: 18px;
      padding: 40px 50px;
      width: 950px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 191, 255, 0.25);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .header {
      margin-bottom: 25px;
      text-align: center;
    }

    .header .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header i {
      color: #00bfff;
      font-size: 1.6em;
      text-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
    }

    .header h2 {
      color: #00bfff;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.6em;
      margin: 0;
      text-shadow: 0 0 12px rgba(0, 191, 255, 0.7);
    }

    .header-underline {
      width: 140px;
      height: 3px;
      background: #00bfff;
      border-radius: 2px;
      margin: 10px auto 15px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.7);
    }

    video {
      border-radius: 12px;
      background: #000;
      margin-top: 10px;
      transform: scaleX(-1);
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.25);
    }

    #controls {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      background: rgba(0, 10, 20, 0.8);
      border: 1px solid rgba(0, 191, 255, 0.3);
      color: #dfefff;
      padding: 10px 12px;
      border-radius: 8px;
      width: 220px;
      text-align: center;
      font-size: 0.95em;
      box-shadow: 0 0 8px rgba(0, 191, 255, 0.2);
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9em;
      color: #fff;
      transition: all 0.3s ease;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 191, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #btnStart {
      background: linear-gradient(90deg, #007bff, #00bfff);
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
    }

    #btnStop {
      background: linear-gradient(90deg, #e63946, #ff5a5f);
      box-shadow: 0 0 12px rgba(255, 90, 90, 0.4);
    }

    #btnSubmit {
      background: linear-gradient(90deg, #28a745, #34d058);
      box-shadow: 0 0 12px rgba(40, 167, 69, 0.5);
    }

    .charts {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .chart-container {
      flex: 1;
      min-width: 350px;
      max-width: 400px;
    }

    canvas {
      background: rgba(0, 10, 20, 0.7);
      border: 1px solid rgba(0, 191, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.15);
    }

    #latest {
      margin-top: 35px;
      color: #b8dfff;
      font-size: 0.95em;
      background: rgba(0, 15, 25, 0.6);
      display: inline-block;
      padding: 18px 22px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
      text-align: left;
      line-height: 1.7em;
      min-width: 360px;
    }

    #latest > div {
      margin: 8px 0;
    }

    .insight {
      font-style: italic;
      color: #00bfff;
      text-align: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 191, 255, 0.2);
      text-shadow: 0 0 8px rgba(0, 191, 255, 0.6);
    }

    #summaryBox {
      display: none;
      background: rgba(0, 10, 20, 0.6);
      padding: 30px;
      margin-top: 35px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
      text-align: left;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.8em;
      animation: fadeIn 0.8s ease;
    }

    #summaryBox h3 {
      color: #00bfff;
      text-align: center;
      text-shadow: 0 0 12px rgba(0, 191, 255, 0.7);
      margin-top: 0;
    }

    #summaryBox p {
      margin: 12px 0;
      font-size: 1.05em;
    }

    #summaryBox b {
      color: #00bfff;
      min-width: 200px;
      display: inline-block;
    }

    #summaryBox span {
      color: #dfefff;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .interview-card {
        width: 95%;
        padding: 30px 20px;
      }
      
      video {
        width: 100%;
        height: auto;
      }

      .charts {
        flex-direction: column;
        align-items: center;
      }

      #latest {
        min-width: auto;
        width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="interview-card">
    <div class="header">
      <div class="title">
        <i class="fas fa-video"></i>
        <h2>Interview Analysis (Live)</h2>
      </div>
      <div class="header-underline"></div>
    </div>

    <video id="webcam" autoplay playsinline width="480" height="360"></video>

    <div id="controls">
      <button id="btnStart">Start</button>
      <button id="btnStop">Stop</button>
      <input id="candidateId" placeholder="Candidate ID (optional)">
      <button id="btnSubmit">Finish Interview</button>
    </div>

    <!-- Charts Section -->
    <div class="charts">
      <div class="chart-container">
        <canvas id="confChart" width="350" height="220"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="engChart" width="350" height="220"></canvas>
      </div>
    </div>

    <!-- Live Metrics Display -->
    <div id="latest">
      <div><b>Time:</b> <span id="dataTime">--:--:--</span></div>
      <div><b>Identity Confidence:</b> <span id="dataIdentity">--</span></div>
      <div><b>Engagement:</b> <span id="dataEngagement">--</span></div>
      <div><b>Eye:</b> <span id="dataEye">--</span> &nbsp;&nbsp; <b>Mouth:</b> <span id="dataMouth">--</span></div>
      <div><b>Emotion:</b> <span id="emotionVal">--</span></div>
      <hr style="border: none; border-top: 1px solid rgba(0, 191, 255, 0.2); margin: 12px 0;">
      <div class="insight" id="insightMsg">Awaiting live feed...</div>
    </div>

    <!-- Summary Box (shown after finishing) -->
    <div id="summaryBox">
      <h3>Interview Summary</h3>
      <p><b>Average Identity:</b> <span id="avgIdentity">–</span></p>
      <p><b>Average Engagement:</b> <span id="avgEngagement">–</span></p>
      <p><b>Average Eye Score:</b> <span id="avgEye">–</span></p>
      <p><b>Average Mouth Score:</b> <span id="avgMouth">–</span></p>
      <p><b>Performance Verdict:</b> <span id="verdict">–</span></p>
    </div>
  </div>

  <!-- Load the JavaScript -->
  <script src="interview.js"></script>
</body>
</html>
